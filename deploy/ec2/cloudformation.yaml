AWSTemplateFormatVersion: "2010-09-09"
Description: LSAT Speedrun sandbox with EC2 web, PostgreSQL, SQS, and Lambda AI workers.

Parameters:
  SourceCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: IPv4 CIDR allowed to reach the web application.
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceProfileName:
    Type: String
    Default: EswManagedInstance
    Description: Pre-approved sandbox EC2 profile that enables Systems Manager.
  InstanceRoleName:
    Type: String
    Default: EswManagedInstance
    Description: IAM role inside InstanceProfileName; receives least-privilege SQS send access.
  GitRepository:
    Type: String
    Default: https://github.com/nischayhegde/LSATspeedrun.git
  GitCommit:
    Type: String
    Description: Full Git commit SHA to deploy.
    AllowedPattern: "^[0-9a-f]{40}$"
  GoogleClientId:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Google OAuth web client ID exposed to the browser and verified by the API.
  TrueFoundryUrl:
    Type: String
    MinLength: 1
    Description: TrueFoundry OpenAI-compatible endpoint base URL.
  TrueFoundryApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: TrueFoundry API key used only by the API and Lambda worker.
  DatabaseName:
    Type: String
    Default: lsatspeedrun
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseUsername:
    Type: String
    Default: lsatapp
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  LambdaCodeS3Bucket:
    Type: String
    MinLength: 3
    Description: S3 bucket containing the Linux-compatible Lambda deployment zip.
  LambdaCodeS3Key:
    Type: String
    MinLength: 1
    Description: S3 key containing the Lambda deployment zip.
  AiWorkerEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enables SQS delivery only after the web database migration is healthy.
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Optional IAM permissions boundary required by some sandbox accounts.
  OwnerEmail:
    Type: String
    Default: nischay.hegde@alphaaiengineering.com
  ProjectName:
    Type: String
    Default: lsatspeedrun

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  IsAiWorkerEnabled: !Equals [!Ref AiWorkerEnabled, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.73.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.73.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.73.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-private-a
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.73.3.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-private-b
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-nat
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-private
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetB

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP access to the LSAT Speedrun sandbox
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Web application
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref SourceCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-web
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress for LSAT Speedrun Lambda workers
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-lambda
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access from the web and Lambda workers only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: PostgreSQL from web
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WebSecurityGroup
        - Description: PostgreSQL from Lambda
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-db
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for LSAT Speedrun PostgreSQL
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      ManageMasterUserPassword: true
      AllocatedStorage: 20
      MaxAllocatedStorage: 50
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  AiJobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-ai-dlq
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  AiJobQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 270
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiJobDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-ai
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  WebQueuePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-sandbox-send-ai-jobs
      Roles:
        - !Ref InstanceRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt AiJobQueue.Arn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !GetAtt Database.MasterUserSecret.SecretArn
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt AiWorker.Arn
          - Effect: Allow
            Action: cloudformation:SignalResource
            Resource: !Ref AWS::StackId

  AiWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: consume-ai-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt AiJobQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-ai-worker
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  AiWorker:
    Type: AWS::Lambda::Function
    Properties:
      Description: Processes LSAT Speedrun AI generation jobs outside web requests.
      Runtime: python3.11
      Architectures:
        - x86_64
      Handler: lambda_handler.handler
      Role: !GetAtt AiWorkerRole.Arn
      MemorySize: 1024
      Timeout: 240
      ReservedConcurrentExecutions: 2
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          DATABASE_HOST: !GetAtt Database.Endpoint.Address
          DATABASE_PORT: !GetAtt Database.Endpoint.Port
          DATABASE_NAME: !Ref DatabaseName
          FLASK_ENV: production
          DEV_AUTH_ENABLED: "false"
          AUTO_SEED: "false"
          TFY_URL: !Ref TrueFoundryUrl
          TFY_API_KEY: !Ref TrueFoundryApiKey
          AI_JOBS_MODE: worker
          AI_JOB_MAX_ATTEMPTS: "3"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-ai-worker
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  AiWorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AiJobQueue.Arn
      FunctionName: !Ref AiWorker
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: !If [IsAiWorkerEnabled, true, false]
      ScalingConfig:
        MaximumConcurrency: 2

  AiWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AiWorker}
      RetentionInDays: 7
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox-ai-worker
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: WebQueuePolicy
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        InstanceMarketOptions:
          MarketType: spot
          SpotOptions:
            InstanceInterruptionBehavior: terminate
            SpotInstanceType: one-time
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeviceIndex: 0
            Groups:
              - !Ref WebSecurityGroup
            SubnetId: !Ref PublicSubnet
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 16
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${ProjectName}-sandbox
              - Key: Project
                Value: !Ref ProjectName
              - Key: Environment
                Value: ephemeral
              - Key: ManagedBy
                Value: cloudformation
              - Key: Owner
                Value: !Ref OwnerEmail
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub ${ProjectName}-sandbox
              - Key: Project
                Value: !Ref ProjectName
              - Key: Environment
                Value: ephemeral
              - Key: ManagedBy
                Value: cloudformation
              - Key: Owner
                Value: !Ref OwnerEmail
        UserData:
          Fn::Base64:
            !Sub |
              #!/bin/bash
              set -Eeuo pipefail

              signal_failure() {
                aws cloudformation signal-resource \
                  --stack-name ${AWS::StackName} \
                  --logical-resource-id WebInstance \
                  --unique-id "$(cat /var/lib/cloud/data/instance-id)" \
                  --status FAILURE \
                  --region ${AWS::Region} || true
              }
              trap signal_failure ERR

              dnf update -y
              dnf install -y git nginx python3.11 python3.11-pip openssl
              curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
              dnf install -y nodejs

              useradd --system --home-dir /opt/lsat-speedrun --shell /sbin/nologin lsatapp || true
              install -d -o lsatapp -g lsatapp /opt/lsat-speedrun /var/lib/lsat-speedrun

              cd /opt/lsat-speedrun
              git config --system --add safe.directory /opt/lsat-speedrun
              git init
              git remote add origin ${GitRepository}
              git config core.sparseCheckout true
              printf 'backend/\nfrontend/\n' > .git/info/sparse-checkout
              git fetch --depth 1 origin ${GitCommit}
              git checkout --detach FETCH_HEAD

              python3.11 -m venv /opt/lsat-speedrun/.venv
              /opt/lsat-speedrun/.venv/bin/python -m pip install --upgrade pip
              /opt/lsat-speedrun/.venv/bin/python -m pip install -r backend/requirements.txt gunicorn==23.0.0

              cd /opt/lsat-speedrun/frontend
              VITE_API_URL=/v1 npm ci
              VITE_API_URL=/v1 npm run build
              install -d /var/www/lsat-speedrun
              cp -a dist/. /var/www/lsat-speedrun/

              install -m 600 /dev/null /etc/lsat-speedrun.env
              printf 'SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> /etc/lsat-speedrun.env
              cat >> /etc/lsat-speedrun.env <<'ENVIRONMENT'
              DATABASE_SECRET_ARN=${Database.MasterUserSecret.SecretArn}
              DATABASE_HOST=${Database.Endpoint.Address}
              DATABASE_PORT=${Database.Endpoint.Port}
              DATABASE_NAME=${DatabaseName}
              AWS_DEFAULT_REGION=${AWS::Region}
              AWS_REGION=${AWS::Region}
              FLASK_ENV=production
              FRONTEND_ORIGIN=http://localhost
              GOOGLE_CLIENT_ID=${GoogleClientId}
              TFY_URL=${TrueFoundryUrl}
              TFY_API_KEY=${TrueFoundryApiKey}
              AI_JOBS_MODE=sqs
              AI_JOB_QUEUE_URL=${AiJobQueue}
              AI_JOB_MAX_ATTEMPTS=3
              DEV_AUTH_ENABLED=false
              AUTO_SEED=false
              PRACTICE_SESSION_SIZE=10
              ENVIRONMENT

              install -d -o lsatapp -g lsatapp /opt/lsat-speedrun/backend/instance
              chown -R lsatapp:lsatapp /opt/lsat-speedrun /var/lib/lsat-speedrun

              set -a
              source /etc/lsat-speedrun.env
              set +a
              cd /opt/lsat-speedrun/backend
              runuser -u lsatapp -- /opt/lsat-speedrun/.venv/bin/python -m flask --app run db --directory migrations upgrade
              runuser -u lsatapp -- /opt/lsat-speedrun/.venv/bin/python -m flask --app run seed

              cat > /etc/systemd/system/lsat-speedrun.service <<'SERVICE'
              [Unit]
              Description=LSAT Speedrun Flask API
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              User=lsatapp
              Group=lsatapp
              WorkingDirectory=/opt/lsat-speedrun/backend
              EnvironmentFile=/etc/lsat-speedrun.env
              ExecStart=/opt/lsat-speedrun/.venv/bin/gunicorn --bind 127.0.0.1:8000 --workers 1 --threads 4 --timeout 180 --access-logfile - --error-logfile - run:app
              Restart=always
              RestartSec=5
              NoNewPrivileges=true
              PrivateTmp=true

              [Install]
              WantedBy=multi-user.target
              SERVICE

              cat > /etc/nginx/conf.d/lsat-speedrun.conf <<'NGINX'
              server {
                  listen 80 default_server;
                  server_name _;
                  root /var/www/lsat-speedrun;
                  index index.html;

                  location /v1/ {
                      proxy_pass http://127.0.0.1:8000;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }

                  location /assets/ {
                      try_files $uri =404;
                      add_header Cache-Control "public, max-age=31536000, immutable";
                  }

                  location / {
                      try_files $uri $uri/ /index.html;
                  }
              }
              NGINX

              rm -f /etc/nginx/conf.d/default.conf
              systemctl daemon-reload
              systemctl enable --now lsat-speedrun nginx
              curl --fail --retry 15 --retry-delay 2 http://127.0.0.1/v1/health
              aws cloudformation signal-resource \
                --stack-name ${AWS::StackName} \
                --logical-resource-id WebInstance \
                --unique-id "$(cat /var/lib/cloud/data/instance-id)" \
                --status SUCCESS \
                --region ${AWS::Region}
              trap - ERR
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: !Sub ${ProjectName}-sandbox
            - Key: Project
              Value: !Ref ProjectName
            - Key: Environment
              Value: ephemeral
            - Key: ManagedBy
              Value: cloudformation
            - Key: Owner
              Value: !Ref OwnerEmail

  WebInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
      - PublicSubnetRouteTableAssociation
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT20M
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: LSAT Speedrun sandbox HTTPS entrypoint
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: app-origin
            DomainName: !GetAtt WebInstance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: app-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-sandbox
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: ephemeral
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref OwnerEmail

Outputs:
  ApplicationUrl:
    Description: Public HTTPS URL for the sandbox application.
    Value: !Sub https://${WebDistribution.DomainName}
  HealthUrl:
    Description: Public API health endpoint.
    Value: !Sub https://${WebDistribution.DomainName}/v1/health
  DirectInstanceUrl:
    Description: Direct HTTP origin used by CloudFront.
    Value: !Sub http://${WebInstance.PublicDnsName}
  DistributionId:
    Description: CloudFront distribution serving the HTTPS application.
    Value: !Ref WebDistribution
  InstanceId:
    Description: EC2 instance managed by this stack.
    Value: !Ref WebInstance
  DatabaseEndpoint:
    Description: Private PostgreSQL endpoint.
    Value: !GetAtt Database.Endpoint.Address
  AiJobQueueUrl:
    Description: SQS queue used by the Flask API.
    Value: !Ref AiJobQueue
  AiWorkerFunction:
    Description: Lambda function processing AI jobs.
    Value: !Ref AiWorker
  AiJobDeadLetterQueueUrl:
    Description: Failed jobs requiring inspection.
    Value: !Ref AiJobDeadLetterQueue
