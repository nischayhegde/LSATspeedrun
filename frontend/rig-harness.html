<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Humanoid Rig Harness</title>
    <style>
      body { margin: 0; background: #10151c; color: #e8e2d5; font-family: system-ui, sans-serif; }
      .harness { display: grid; grid-template-columns: 1fr 280px; min-height: 100vh; }
      .harness-stage { position: relative; }
      .harness-stage canvas { display: block; width: 100%; height: 100vh; }
      .harness-panel { padding: 18px 16px 60px; background: #161d26; border-left: 1px solid #2a3441; overflow-y: auto; max-height: 100vh; }
      .harness-panel h1 { font-size: 1rem; margin: 0 0 4px; }
      .harness-panel h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: #8fa0b4; margin: 20px 0 8px; }
      .harness-note { color: #8fa0b4; font-size: .78rem; margin: 0 0 8px; line-height: 1.45; }
      .harness-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .harness-grid button { font: inherit; font-size: .8rem; padding: 7px 8px; border-radius: 6px; border: 1px solid #2f3b4a; background: #1d2733; color: #e8e2d5; cursor: pointer; }
      .harness-grid button:hover { border-color: #4a5f78; }
      .harness-grid button[aria-pressed="true"] { background: #2d4763; border-color: #6d94bd; font-weight: 600; }
      .harness-hud { position: absolute; top: 12px; left: 12px; background: rgba(10,14,19,.82); border: 1px solid #2a3441; border-radius: 8px; padding: 10px 12px; font-variant-numeric: tabular-nums; font-size: .78rem; line-height: 1.65; }
      .harness-hud b { color: #9fc4e8; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/rig-harness-main.tsx"></script>
  </body>
</html>
