<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strategy Gate Harness</title>
    <style>
      body { margin: 0; background: #f8f3e8; }
      .harness { max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; font-family: system-ui, sans-serif; }
      .harness h1 { font-size: 1.2rem; }
      .harness-meta { color: #6f756f; font-size: .85rem; }
      .harness-card { background: #fffdf7; border: 1px solid #d8d0c2; border-radius: 10px; padding: 18px 20px; margin: 0 0 18px; }
      .harness-actions { display: flex; gap: 10px; }
      .harness-actions button, .harness-card > button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #d8d0c2; background: #f8f3e8; cursor: pointer; }
      .harness-actions button[aria-pressed="true"] { background: #f5e8c8; border-color: #9a6c28; font-weight: 600; }
      .harness-choices { display: grid; gap: 8px; margin: 14px 0; }
      .harness-choices button { font: inherit; text-align: left; padding: 10px 12px; border-radius: 6px; border: 1px solid #d8d0c2; background: #f8f3e8; cursor: pointer; }
      .harness-choices button.is-on { background: #f5e8c8; border-color: #9a6c28; }
      .harness-choices button[disabled] { opacity: .45; text-decoration: line-through; cursor: not-allowed; }
      .harness-reasoning { display: grid; gap: 4px; margin: 12px 0; }
      .harness-reasoning textarea { font: inherit; width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d8d0c2; }
      .harness-error { color: #a84645; background: #f8e7e3; border-radius: 6px; padding: 8px 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gate-harness-main.tsx"></script>
  </body>
</html>
