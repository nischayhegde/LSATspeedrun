<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102735" />
    <meta name="description" content="Lawyer Tycoon — investor deck." />
    <!-- The app's own favicon: the scales of justice in navy, gold and cream.
         The same mark is the deck's recurring motif, so it is the same SVG. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23102735' stroke='%23c89b4b' stroke-width='3'/%3E%3Cpath d='M32 14v34M20 22h24M17 22 10 36h14L17 22Zm30 0-7 14h14l-7-14ZM23 49h18' fill='none' stroke='%23f5e8c8' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- Archivo, served from `public/fonts/`. This used to be a `preconnect` pair
         and a stylesheet from `fonts.googleapis.com`, which made the deck's
         typography depend on the conference wifi: with Google unreachable the
         `@font-face` rules never arrive, `display=swap` has nothing to swap to,
         and the whole talk is set in the fallback — measured as a 941px headline
         where Archivo draws 954px, so it was a silent substitution rather than a
         visible failure. Now there is nothing outside `public/` to reach for.

         `archivo-v25-latin-wght.woff2` is byte-identical to the file Google was
         serving: the `latin` subset of Archivo's variable face, 34.9KB, one
         `wght` axis from 100 to 900, 230 codepoints. Verified to cover every
         non-ASCII character in `src/` that Google's subset covered, and to lack
         exactly the twelve it also lacked (`→`, `≈`, `π` and friends already fell
         back to a system face and still do). Google's `latin-ext` and
         `vietnamese` subsets are not vendored because nothing in the deck reaches
         them, which is why the browser only ever downloaded this one file.
         `OFL.txt` beside it is the licence the OFL requires to travel with it.

         Four `@font-face` rules from the one file, and the number is not
         arbitrary: it reproduces Google's own CSS exactly, so which instance the
         browser picks for a given `font-weight` does not change. Declaring the
         axis as a `100 900` range instead would be fewer bytes and more correct
         in the abstract, but `deck.css` sets weights of 620, 640, 750 and 850,
         and those currently resolve to the nearest declared instance rather than
         interpolating. Changing that is a typographic decision, not a loading
         one.

         Inline rather than in a stylesheet so the declarations exist while the
         document is still parsing, and `preload`ed above so the fetch starts in
         the same breath. `block` rather than `swap` because a swap is the thing
         to avoid here: the file is same-origin, preloaded and 34.9KB, so it wins
         every race that matters, and the boot plate below covers the viewport
         until React mounts anyway. `swap` would buy a fallback frame nobody sees
         at the cost of a reflow everybody would. -->
    <link
      rel="preload"
      href="/fonts/archivo-v25-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 500;
        font-stretch: 100%;
        font-display: block;
        src: url('/fonts/archivo-v25-latin-wght.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 600;
        font-stretch: 100%;
        font-display: block;
        src: url('/fonts/archivo-v25-latin-wght.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 700;
        font-stretch: 100%;
        font-display: block;
        src: url('/fonts/archivo-v25-latin-wght.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 800;
        font-stretch: 100%;
        font-display: block;
        src: url('/fonts/archivo-v25-latin-wght.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <title>Lawyer Tycoon</title>
    <!-- The opening plate, drawn by the document.
         Transcribed from the app's own boot spinner in `frontend/index.html`
         so the deck opens on the same gold pixel chip the product does. -->
    <style>
      html { background: #05080d; }
      body { margin: 0; min-height: 100vh; background: #05080d; }
      #boot {
        position: fixed; inset: 0; z-index: 9;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #0a1120; color: #f6dfaa; font-size: 11px; letter-spacing: .26em; text-transform: uppercase;
        font-family: "Courier New", "Lucida Console", ui-monospace, monospace;
      }
      #boot i {
        width: 62px; height: 62px; box-sizing: border-box; display: grid; place-items: center;
        border: 3px solid #090d15; border-radius: 2px; background: #f1c85f; color: #172131;
        box-shadow: inset -4px -4px #c48a36, inset 3px 3px #fff0a5, 4px 4px 0 #080c13;
        animation: boot-pulse 1.3s ease-in-out infinite;
      }
      #boot svg { width: 32px; height: 32px; }
      #boot g:first-child { fill: rgba(104, 68, 16, .42); }
      #boot g:last-child { fill: currentColor; }
      #boot .beam { transform-origin: 12px 7px; animation: boot-settle 2.1s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(1.06); box-shadow: inset -4px -4px #c48a36, inset 3px 3px #fff0a5, 4px 4px 0 #080c13, 0 0 0 11px rgba(200, 155, 75, .12); } }
      @keyframes boot-settle { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    </style>
  </head>
  <body>
    <noscript><style>#boot { display: none; }</style></noscript>
    <div id="boot" role="status">
      <i aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><g transform="translate(.9 .9)"><path d="M7 20h10v2H7z M10 18h4v2h-4z M11 7h2v11h-2z M10 3h4v3h-4z"/><path d="M3 6h18v2H3z M4 8h1v3H4z M19 8h1v3h-1z M1 11h7l-1.75 3.25h-3.5z M16 11h7l-1.75 3.25h-3.5z"/></g><g><path d="M7 20h10v2H7z M10 18h4v2h-4z M11 7h2v11h-2z M10 3h4v3h-4z"/><path class="beam" d="M3 6h18v2H3z M4 8h1v3H4z M19 8h1v3h-1z M1 11h7l-1.75 3.25h-3.5z M16 11h7l-1.75 3.25h-3.5z"/></g></svg></i>
      <span>Opening the firm</span>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var boot = document.getElementById('boot')
        var root = document.getElementById('root')
        if (!boot || !root) return
        function leave() {
          boot.style.transition = 'opacity .4s steps(5)'
          boot.style.opacity = '0'
          setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot) }, 420)
        }
        if (root.firstChild) { leave(); return }
        new MutationObserver(function (_records, observer) {
          if (!root.firstChild) return
          observer.disconnect()
          leave()
        }).observe(root, { childList: true })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
